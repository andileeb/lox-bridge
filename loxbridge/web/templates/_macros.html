{% macro field(f) -%}
<label class="{% if f.locked %}locked{% endif %} {% if f.kind == 'bool' %}switch{% endif %}">
{% if f.kind == "bool" %}
  <input type="checkbox" role="switch" name="{{ f.name }}" {% if f.value %}checked{% endif %} {% if f.locked %}disabled{% endif %}> {{ f.label }}
{% else %}{{ f.label }}
{% if f.kind == "select" %}
  <select name="{{ f.name }}" {% if f.locked %}disabled{% endif %}>
  {% for o in f.options %}<option value="{{ o }}" {% if o == f.value|string %}selected{% endif %}>{{ o or "(none)" }}</option>{% endfor %}
  </select>
{% elif f.kind == "secret" %}
  <input type="password" name="{{ f.name }}" placeholder="{{ f.value or 'not set' }}" autocomplete="new-password" {% if f.locked %}disabled{% endif %}>
  {% if f.value %}<small>Stored. Leave empty to keep it.</small>{% endif %}
{% elif f.kind == "list" %}
  <textarea name="{{ f.name }}" rows="3" {% if f.locked %}disabled{% endif %}>{{ f.value }}</textarea>
  <small>One per line.</small>
{% elif f.kind == "number" %}
  <input type="number" step="{{ f.step }}" name="{{ f.name }}" value="{{ f.value }}" inputmode="decimal" {% if f.locked %}disabled{% endif %}>
{% else %}
  <input type="text" name="{{ f.name }}" value="{{ f.value }}" {% if f.locked %}disabled{% endif %}>
{% endif %}{% endif %}
{% if f.locked %}<small class="lock">Locked by an environment variable.</small>{% endif %}
{% if f.help %}<small>{{ f.help }}</small>{% endif %}
</label>
{%- endmacro %}

{% macro status(s) -%}
<span class="badge {{ s }}">{{ s }}</span>
{%- endmacro %}

{% macro dot(s) -%}<span class="dot {{ s }}" aria-hidden="true"></span>{%- endmacro %}

{% macro logo() -%}
<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#3d9b35"/><path d="M5 22h22M8 22v-4a8 8 0 0 1 16 0v4M12 22v-3M16 22v-4M20 22v-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
{%- endmacro %}

  "archive": '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>',

  "settings": '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',

{%- endmacro %}

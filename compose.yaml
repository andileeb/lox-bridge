# TrueNAS: Apps -> Discover Apps -> ⋮ -> Install via YAML.
# Only change "tank" to your pool name and set ADMIN_PASSWORD. The folders are created on first start and handed to
# the "apps" user (568) automatically. Want the backups in their own dataset (own snapshot schedule / quota)? Create
# it and put its path on the /backups line.
services:
  loxbridge:
    image: ghcr.io/andileeb/loxbridge:0.1.4
    restart: unless-stopped
    ports:
      - "18568:8080"   # NAS port : container port; change only the left side if 18568 is taken
    environment:
      TZ: Europe/Vienna
      ADMIN_PASSWORD: change-me-on-first-start   # only used on the first start; remove afterwards
      # SECRET_KEY: optional; otherwise /config/secret.key is generated (back it up!)
    volumes:
      - /mnt/tank/apps/loxbridge/config:/config
      - /mnt/tank/apps/loxbridge/work:/work
      - /mnt/tank/apps/loxbridge/backups:/backups

# "Web UI" button in the TrueNAS apps list. Keep port = the host side of the ports line above.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 18568
    path: /

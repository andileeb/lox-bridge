name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - run: uv sync --locked -p 3.13
      - run: uv run ruff check loxbridge tests
      - run: uv run mypy loxbridge/settings loxbridge/backup loxbridge/miniserver loxbridge/bridge
      - run: uv run pytest -q

  # PRs: build only. Pushes to main: preview image ghcr.io/<owner>/loxbridge:edge (+ sha-<commit>) after the checks
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/loxbridge
          tags: |
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=LoxBridge (preview)
            org.opencontainers.image.description=Preview build of main, not a release
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

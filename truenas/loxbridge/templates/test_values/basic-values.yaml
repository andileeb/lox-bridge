resources:
  limits:
    cpus: 2.0
    memory: 1024

TZ: Europe/Vienna

loxbridge:
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/loxbridge/config
  work: /opt/tests/mnt/loxbridge/work
  backups: /opt/tests/mnt/loxbridge/backups

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  work:
    type: ix_volume
    ix_volume_config:
      dataset_name: work
      create_host_path: true
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  additional_storage: []

[project]
name = "loxbridge"
version = "0.1.0"
description = "Loxone Miniserver backup and read-only data bridge"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
  "pydantic>=2.9",
  "httpx>=0.27",
  "websockets>=14",
  "apscheduler>=3.10,<4",
  "boto3>=1.35",
  "aiomqtt>=2.3",
  "prometheus-client>=0.21",
  "cryptography>=43",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = ["pytest>=8", "moto[s3]>=5", "ruff>=0.7", "mypy>=1.13", "playwright>=1.48"]

[project.scripts]
loxbridge = "loxbridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

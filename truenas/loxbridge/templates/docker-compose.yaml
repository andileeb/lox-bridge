{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.loxbridge_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# Runs as the given user directly; the image only switches users itself when started as root. #}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/api/v1/health"}) %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("CONFIG_DIR", values.consts.config_dir_path) %}
{% do c1.environment.add_env("WORK_DIR", values.consts.work_dir_path) %}
{% do c1.environment.add_env("BACKUP_DIR", values.consts.backups_dir_path) %}

{% do c1.environment.add_user_envs(values.loxbridge.additional_envs) %}
{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.config_dir_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% do c1.add_storage(values.consts.work_dir_path, values.storage.work) %}
{% do perm_container.add_or_skip_action("work", values.storage.work, perms_config) %}

{% do c1.add_storage(values.consts.backups_dir_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}

name: Release

on:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject version $v"; exit 1; }
          grep -q "__version__ = \"$v\"" loxbridge/__init__.py
          grep -q "loxbridge:$v" compose.yaml
          # TrueNAS catalog app (truenas/loxbridge) uses the same version everywhere
          grep -qx "version: $v" truenas/loxbridge/app.yaml
          grep -qx "app_version: $v" truenas/loxbridge/app.yaml
          grep -q "tag: \"$v\"" truenas/loxbridge/ix_values.yaml
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag upstream
      - run: uv sync --locked -p 3.13
      - run: uv run ruff check loxbridge tests
      - run: uv run mypy loxbridge/settings loxbridge/backup loxbridge/miniserver loxbridge/bridge
      - run: uv run pytest -q

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/loxbridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=LoxBridge
            org.opencontainers.image.description=Loxone Miniserver Gen 2 backup and read-only data bridge
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: compose.yaml

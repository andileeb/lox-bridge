apiVersion: 1
datasources:
  - name: Loxone InfluxDB
    uid: loxbridge-influx
    type: influxdb
    access: proxy
    url: ${INFLUX_URL:-http://influxdb:8086}
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG:-home}
      defaultBucket: ${INFLUX_BUCKET:-loxone}
    secureJsonData:
      token: ${INFLUX_TOKEN}
  - name: LoxBridge Prometheus
    uid: loxbridge-prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL:-http://prometheus:9090}
